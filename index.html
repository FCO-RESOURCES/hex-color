<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE database 💔</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5"></script>
    <style>
        * { box-sizing: border-box; }
        :root { --bg: #0f1115; --card: #1c1f26; --text: #f8f8f2; --primary: #6366f1; --primary-hover: #4f46e5; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 480px; }
        input, button, select { font-family: inherit; }
        #login-screen { display: flex; flex-direction: column; gap: 15px; margin-top: 50px; width: 100%; }
        #app-screen { display: none; flex-direction: column; gap: 20px; width: 100%; }
        .picker-card { background: var(--card); padding: 20px; border-radius: 16px; display: flex; flex-direction: column; gap: 15px; border: 1px solid #2a2e37; }
        .color-tabs { display: flex; gap: 8px; width: 100%; }
        .color-tab { flex: 1; background: #15171c; padding: 10px; border: 2px solid #333; border-radius: 12px; text-align: center; cursor: pointer; }
        .color-tab.active { border-color: var(--primary); background: rgba(99, 102, 241, 0.1); }
        .tab-swatch { width: 100%; height: 20px; border-radius: 4px; margin: 5px 0; }
        .dim-box { background: #15171c; padding: 15px; border-radius: 10px; border: 1px solid #333; }
        .dim-row { display: flex; gap: 10px; margin-top: 10px; }
        .dim-field { flex: 1; display: flex; align-items: center; background: #0f1115; border-radius: 8px; border: 1px solid #333; padding-right: 8px; }
        .dim-field input { background: transparent; border: none; color: white; padding: 10px; width: 100%; outline: none; }
        .color-item { background: var(--card); border-radius: 12px; border: 1px solid #2a2e37; overflow: hidden; margin-bottom: 15px; }
        .full-bar { width: 100%; height: 50px; border-bottom: 1px solid #2a2e37; }
        .item-footer { padding: 15px; display: flex; justify-content: space-between; align-items: flex-start; }
        .tag { background: #15171c; border: 1px solid #333; padding: 3px 7px; border-radius: 5px; font-size: 11px; color: #8b949e; margin: 2px; display: inline-block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>THE database 💔</h1>
        <div id="login-screen">
            <input type="password" id="password" placeholder="Enter Password" style="padding:14px; border-radius:10px; background:#15171c; color:white; border:1px solid #333;">
            <button onclick="login()" style="padding:14px; border-radius:10px; background:var(--primary); color:white; border:none; font-weight:bold;">Login</button>
        </div>

        <div id="app-screen">
            <div class="picker-card">
                <div class="color-tabs">
                    <div class="color-tab active" id="tab-0" onclick="switchTab(0)">
                        <div style="font-size:10px; color:#888;">BASE</div>
                        <div class="tab-swatch" id="swatch-0"></div>
                        <input type="text" id="hex-0" style="width:100%; background:transparent; border:none; color:white; text-align:center; font-size:12px;" maxlength="7">
                    </div>
                    <div class="color-tab" id="tab-1" onclick="switchTab(1)">
                        <div style="font-size:10px; color:#888;">TIP</div>
                        <div class="tab-swatch" id="swatch-1"></div>
                        <input type="text" id="hex-1" style="width:100%; background:transparent; border:none; color:white; text-align:center; font-size:12px;" maxlength="7">
                    </div>
                </div>
                <div id="color-wheel" style="display:flex; justify-content:center;"></div>
                <div class="dim-box">
                    <div style="display:flex; justify-content:space-between; font-size:12px;">
                        <span>DIMENSIONS (<span id="unitText">cm</span>)</span>
                        <button onclick="toggleUnit()" style="background:#333; color:white; border:none; padding:4px 8px; border-radius:5px; font-size:10px;">Swap Unit</button>
                    </div>
                    <div class="dim-row">
                        <div class="dim-field"><input type="number" id="lIn" placeholder="Length (Ø)"><span style="font-size:10px; color:#555;">cm</span></div>
                        <div class="dim-field"><input type="number" id="gIn" placeholder="Girth (Ø)"><span style="font-size:10px; color:#555;">cm</span></div>
                    </div>
                </div>
                <div id="active-props"></div>
                <button onclick="toggleProps()" style="background:#15171c; color:#888; border:1px dashed #444; padding:10px; font-size:12px;">+ Add Custom Property</button>
                <div id="prop-menu" style="display:none; background:#222; padding:10px; border-radius:10px;">
                    <div id="freq-list" style="display:flex; flex-wrap:wrap; gap:5px; margin-bottom:10px;"></div>
                    <div style="display:flex; gap:5px;">
                        <input type="text" id="pName" placeholder="Name" style="flex:1; background:#111; color:white; border:1px solid #333; padding:5px; font-size:12px;">
                        <select id="pType" style="background:#111; color:white; border:1px solid #333;"><option value="text">Text</option><option value="check">Check</option></select>
                        <button onclick="addPropCloud()" style="padding:5px 10px; font-size:12px;">Add</button>
                    </div>
                </div>
                <input type="text" id="cName" placeholder="Entry Name..." style="width:100%; padding:12px; background:#15171c; border:1px solid #333; color:white; border-radius:10px;">
                <button onclick="save()" style="width:100%; padding:14px; background:var(--primary); color:white; border:none; font-weight:bold; border-radius:10px;">Save Entry</button>
            </div>
            <button onclick="logout()" style="background:transparent; color:#555; border:1px solid #333; width:100%; padding:10px; border-radius:10px;">Logout</button>
            <div id="list"></div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://color-backend.luku-di456.workers.dev";
        let picker, activeTab = 0, useInches = false, activeColors = ["#6366f1", "#ec4899"], currentProps = [], freqProps = [];

        window.onload = () => {
            initPicker();
            if(localStorage.getItem('db_password')) loadData();
        };

        function initPicker() {
            picker = new iro.ColorPicker("#color-wheel", { width: 250, color: activeColors[0] });
            picker.on('color:change', c => { activeColors[activeTab] = c.hexString; updateSwatches(); });
            [0, 1].forEach(i => document.getElementById('hex-'+i).addEventListener('input', e => {
                if(e.target.value.length === 7) { activeColors[i] = e.target.value; if(activeTab === i) picker.color.hexString = e.target.value; updateSwatches(); }
            }));
            updateSwatches();
        }

        function updateSwatches() {
            document.getElementById('swatch-0').style.backgroundColor = activeColors[0];
            document.getElementById('swatch-1').style.backgroundColor = activeColors[1];
            document.getElementById('hex-0').value = activeColors[0].toUpperCase();
            document.getElementById('hex-1').value = activeColors[1].toUpperCase();
        }

        function switchTab(i) { activeTab = i; document.getElementById('tab-0').className = i===0?'color-tab active':'color-tab'; document.getElementById('tab-1').className = i===1?'color-tab active':'color-tab'; picker.color.hexString = activeColors[i]; }
        function toggleUnit() { useInches = !useInches; document.getElementById('unitText').innerText = useInches?'in':'cm'; document.querySelectorAll('.dim-field span').forEach(s => s.innerText = useInches?'in':'cm'); }
        function toggleProps() { let m = document.getElementById('prop-menu'); m.style.display = m.style.display==='none'?'block':'none'; }

        function getHeaders() { return { 'Authorization': 'bearer ' + localStorage.getItem('db_password'), 'Content-Type': 'application/json' }; }

        async function loadData() {
            const h = getHeaders();
            try {
                const [pRes, cRes] = await Promise.all([fetch(WORKER_URL+'/api/props', {headers:h}), fetch(WORKER_URL+'/api/colors', {headers:h})]);
                if(pRes.status === 401) return logout();
                freqProps = await pRes.json();
                renderFreq();
                renderColors(await cRes.json());
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'flex';
            } catch(e) { console.error(e); }
        }

        async function addPropCloud() {
            const name = document.getElementById('pName').value;
            const type = document.getElementById('pType').value;
            if(!name) return;
            await fetch(WORKER_URL+'/api/props', { method:'POST', headers:getHeaders(), body:JSON.stringify({name, type}) });
            document.getElementById('pName').value = '';
            loadData();
        }

        async function delPropCloud(name) {
            await fetch(WORKER_URL+'/api/props', { method:'DELETE', headers:getHeaders(), body:JSON.stringify({name}) });
            loadData();
        }

        function renderFreq() {
            const l = document.getElementById('freq-list'); l.innerHTML = '';
            freqProps.forEach(p => {
                l.innerHTML += `<div style="background:#111; border:1px solid #333; padding:5px 10px; border-radius:20px; font-size:10px; display:flex; gap:5px;">
                    <span onclick="addPropToForm('${p.name}','${p.type}')" style="cursor:pointer;">+ ${p.name}</span>
                    <span onclick="delPropCloud('${p.name}')" style="color:#ef4444; cursor:pointer;">✕</span>
                </div>`;
            });
        }

        function addPropToForm(name, type) {
            if(currentProps.find(p => p.name === name)) return;
            currentProps.push({name, type, value: type==='check'?false:''});
            renderActive();
            toggleProps();
        }

        function renderActive() {
            const c = document.getElementById('active-props'); c.innerHTML = '';
            currentProps.forEach((p, i) => {
                const input = p.type==='check'? `<input type="checkbox" onchange="currentProps[${i}].value=this.checked">` : `<input type="text" style="flex:1; background:transparent; border:none; border-bottom:1px solid #444; color:white;" oninput="currentProps[${i}].value=this.value">`;
                c.innerHTML += `<div style="display:flex; justify-content:space-between; align-items:center; background:#15171c; padding:10px; border-radius:10px; border:1px solid #333; margin-bottom:5px;">
                    <span style="font-size:12px; color:#aaa;">${p.name}</span>${input}
                    <span onclick="currentProps.splice(${i},1);renderActive();" style="color:#ef4444; cursor:pointer;">✕</span>
                </div>`;
            });
        }

        async function login() {
            const password = document.getElementById('password').value.toLowerCase();
            const res = await fetch(WORKER_URL+'/api/login', { method:'POST', body: JSON.stringify({password}) });
            if(res.ok) { localStorage.setItem('db_password', password); loadData(); } else { alert('Wrong password'); }
        }

        async function save() {
            const body = { name: document.getElementById('cName').value || 'Unnamed', hex1: activeColors[0], hex2: activeColors[1], length: document.getElementById('lIn').value, girth: document.getElementById('gIn').value, unit: useInches?'in':'cm', customFields: currentProps };
            const res = await fetch(WORKER_URL+'/api/colors', { method:'POST', headers:getHeaders(), body: JSON.stringify(body) });
            if(res.ok) { location.reload(); } else { const err = await res.json(); alert(err.error); }
        }

        async function delColor(id) { if(confirm('Delete?')) { await fetch(WORKER_URL+'/api/colors', { method:'DELETE', headers:getHeaders(), body:JSON.stringify({id}) }); loadData(); } }
        function logout() { localStorage.removeItem('db_password'); location.reload(); }

        function renderColors(colors) {
            const l = document.getElementById('list'); l.innerHTML = '';
            colors.forEach(c => {
                const tags = (c.customFields||[]).map(f => `<span class="tag">${f.name}: ${f.value}</span>`).join('');
                l.innerHTML += `<div class="color-item">
                    <div class="full-bar" style="background:linear-gradient(to right, ${c.hex1} 50%, ${c.hex2} 50%)"></div>
                    <div class="item-footer">
                        <div style="flex:1;">
                            <h3 style="margin:0; font-size:14px;">${c.name}</h3>
                            <p style="font-size:10px; color:#666; margin:5px 0;">L: ${c.length||'Ø'} ${c.unit} | G: ${c.girth||'Ø'} ${c.unit}</p>
                            <div>${tags}</div>
                        </div>
                        <button onclick="delColor('${c.id}')" style="background:rgba(239,68,68,0.1); color:#ef4444; border:none; padding:8px; border-radius:8px;">✕</button>
                    </div>
                </div>`;
            });
        }
    </script>
</body>
</html>
