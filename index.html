<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate Color DB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5"></script>
    <style>
        * { box-sizing: border-box; }
        :root { --bg: #0f1115; --card: #1c1f26; --text: #f8f8f2; --primary: #6366f1; --primary-hover: #4f46e5; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 480px; }
        h1 { text-align: center; font-weight: 600; margin-bottom: 25px; }

        /* Login */
        #login-screen { display: flex; flex-direction: column; gap: 15px; margin-top: 50px; width: 100%; }
        input, button, select { font-family: inherit; font-size: 16px; border-radius: 10px; border: 1px solid #333; outline: none; }
        input[type="password"], input[type="text"], input[type="number"] { background: #15171c; color: white; padding: 12px; }
        button { background: var(--primary); color: white; font-weight: 600; cursor: pointer; border: none; padding: 14px; }
        button:active { transform: scale(0.98); }

        /* App Layout */
        #app-screen { display: none; flex-direction: column; gap: 20px; width: 100%; }
        .picker-card { background: var(--card); padding: 20px; border-radius: 16px; display: flex; flex-direction: column; gap: 15px; border: 1px solid #2a2e37; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        /* Tabs & Hex */
        .color-tabs { display: flex; gap: 8px; width: 100%; }
        .color-tab { flex: 1; background: #15171c; padding: 10px; border: 2px solid #333; border-radius: 12px; text-align: center; cursor: pointer; display: flex; flex-direction: column; gap: 5px; }
        .color-tab.active { border-color: var(--primary); background: rgba(99, 102, 241, 0.1); }
        .tab-label { font-size: 10px; font-weight: 600; color: #8b949e; text-transform: uppercase; }
        .tab-swatch { width: 100%; height: 20px; border-radius: 4px; }
        .hex-input { width: 100%; background: transparent; border: none; color: white; font-size: 12px; font-family: monospace; text-align: center; padding: 0; text-transform: uppercase; }

        /* Dimensions */
        .dim-box { width: 100%; background: #15171c; padding: 15px; border-radius: 12px; border: 1px solid #333; }
        .dim-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .dim-row { display: flex; gap: 10px; }
        .dim-field { flex: 1; display: flex; align-items: center; background: #0f1115; border-radius: 8px; border: 1px solid #333; padding-right: 10px; }
        .dim-field input { width: 100%; border: none; background: transparent; padding: 10px; font-size: 14px; }
        .dim-field span { font-size: 11px; color: #555; font-weight: bold; }

        /* Custom Properties */
        .props-area { width: 100%; }
        .prop-row { display: flex; align-items: center; background: #15171c; padding: 8px 12px; border-radius: 10px; border: 1px solid #333; gap: 10px; margin-bottom: 8px; }
        .prop-row label { flex: 1; font-size: 13px; color: #aaa; overflow: hidden; text-overflow: ellipsis; }
        .prop-input-text { flex: 1.5; background: transparent; border: none; border-bottom: 1px solid #444; color: white; padding: 2px; font-size: 14px; }
        .prop-input-slider { flex: 1.5; accent-color: var(--primary); }
        .freq-list { display: flex; flex-wrap: wrap; gap: 6px; background: #0f1115; padding: 10px; border-radius: 10px; border: 1px solid #333; margin-top: 5px; }
        .freq-chip { background: #1c1f26; border: 1px solid #444; border-radius: 20px; font-size: 11px; display: flex; align-items: center; overflow: hidden; }
        .freq-chip-add { padding: 5px 10px; cursor: pointer; }
        .freq-chip-del { padding: 5px 8px; color: #ef4444; border-left: 1px solid #444; cursor: pointer; }

        /* Color List */
        .color-list { display: flex; flex-direction: column; gap: 15px; width: 100%; }
        .color-item { background: var(--card); border-radius: 12px; border: 1px solid #2a2e37; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .full-bar { width: 100%; height: 50px; border-bottom: 1px solid #2a2e37; cursor: pointer; }
        .item-content { padding: 15px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .details h3 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.2; word-break: break-word; }
        .details p { margin: 4px 0; font-size: 11px; color: #8b949e; font-family: monospace; }
        .tag { background: #15171c; border: 1px solid #333; padding: 3px 6px; border-radius: 5px; font-size: 10px; color: #aaa; margin: 2px 2px 0 0; display: inline-block; }
        .delete-btn { background: rgba(239, 68, 68, 0.1); color: #ef4444; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; border-radius: 8px; flex-shrink: 0; }

        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: white; color: black; padding: 10px 20px; border-radius: 25px; font-weight: bold; font-size: 13px; display: none; z-index: 9999; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div class="container">
        <h1>THE database 💔</h1>
        <div id="login-screen">
            <input type="password" id="password" placeholder="Enter Password">
            <button onclick="login()">Login</button>
        </div>
        <div id="app-screen">
            <div class="picker-card">
                <div class="color-tabs">
                    <div class="color-tab active" id="tab-0" onclick="switchTab(0)">
                        <span class="tab-label">Base Color</span>
                        <div class="tab-swatch" id="swatch-0"></div>
                        <input type="text" class="hex-input" id="hex-0" maxlength="7">
                    </div>
                    <div class="color-tab" id="tab-1" onclick="switchTab(1)">
                        <span class="tab-label">Tip Color</span>
                        <div class="tab-swatch" id="swatch-1"></div>
                        <input type="text" class="hex-input" id="hex-1" maxlength="7">
                    </div>
                </div>
                <div id="color-wheel"></div>
                <div class="dim-box">
                    <div class="dim-header">
                        <span style="font-size:11px; font-weight:bold; color:#888;">DIMENSIONS (<span id="unitDisp">cm</span>)</span>
                        <button onclick="toggleUnit()" style="padding:4px 8px; font-size:10px; background:#333; border-radius:6px;">Swap to Inches</button>
                    </div>
                    <div class="dim-row">
                        <div class="dim-field"><input type="number" id="lenIn" placeholder="Length (Ø)" step="0.1"><span class="uL">cm</span></div>
                        <div class="dim-field"><input type="number" id="grtIn" placeholder="Girth (Ø)" step="0.1"><span class="uL">cm</span></div>
                    </div>
                </div>
                <div class="props-area">
                    <div id="active-props"></div>
                    <button onclick="toggleMenu()" style="width:100%; background:#15171c; border:1px dashed #444; font-size:13px; color:#666; margin-top:5px;">+ Add Custom Property</button>
                    <div id="prop-menu" style="display:none; margin-top:10px;">
                        <div class="freq-list" id="freq-list"></div>
                        <div style="display:flex; gap:5px; margin-top:10px;">
                            <input type="text" id="newPropName" placeholder="Name" style="flex:1; font-size:13px; padding:8px;">
                            <select id="newPropType" style="background:#15171c; color:white; border:1px solid #333; font-size:12px;">
                                <option value="text">Text</option>
                                <option value="slider">Slider</option>
                                <option value="check">Check</option>
                            </select>
                            <button onclick="createNewProp()" style="padding:0 12px; font-size:12px;">Add</button>
                        </div>
                    </div>
                </div>
                <input type="text" id="colorName" class="name-input" placeholder="Give this entry a name...">
                <button onclick="saveColor()">Save Entry</button>
            </div>
            <button onclick="logout()" style="background:transparent; border:1px solid #333; color:#555; width:100%; margin-top:10px;">Logout</button>
            <div id="colorList" class="color-list"></div>
        </div>
    </div>
    <div id="toast">Copied!</div>
    <script>
        // ======= CONFIG =======
        const WORKER_URL = "https://color-backend.luku-di456.workers.dev";
        // ======================

        let colorPicker, activeTab = 0, useInches = false;
        let activeColors = ["#6366f1", "#ec4899"];
        let currentProps = [], freqProps = [];

        window.onload = () => {
            initPicker();
            if(localStorage.getItem('db_password')) loadData();
        };

        function initPicker() {
            colorPicker = new iro.ColorPicker("#color-wheel", { width: 250, color: activeColors[0], layout: [{ component: iro.ui.Wheel }, { component: iro.ui.Slider, options: { sliderType: 'value' } }] });
            colorPicker.on('color:change', (color) => {
                activeColors[activeTab] = color.hexString;
                updateUI();
            });
            ['hex-0', 'hex-1'].forEach((id, i) => {
                document.getElementById(id).addEventListener('input', (e) => {
                    let val = e.target.value;
                    if(val.length === 7 || val.length === 4) {
                        activeColors[i] = val;
                        if(activeTab === i) colorPicker.color.hexString = val;
                        updateUI();
                    }
                });
            });
            updateUI();
        }

        function updateUI() {
            document.getElementById('swatch-0').style.backgroundColor = activeColors[0];
            document.getElementById('swatch-1').style.backgroundColor = activeColors[1];
            document.getElementById('hex-0').value = activeColors[0].toUpperCase();
            document.getElementById('hex-1').value = activeColors[1].toUpperCase();
        }

        function switchTab(i) {
            activeTab = i;
            document.getElementById('tab-0').classList.toggle('active', i === 0);
            document.getElementById('tab-1').classList.toggle('active', i === 1);
            colorPicker.color.hexString = activeColors[i];
        }

        function toggleUnit() {
            useInches = !useInches;
            const u = useInches ? 'in' : 'cm';
            document.getElementById('unitDisp').innerText = u;
            document.querySelectorAll('.uL').forEach(s => s.innerText = u);
            document.getElementById('unitToggle').innerText = useInches ? "Swap to cm" : "Swap to Inches";
        }

        function toggleMenu() { const m = document.getElementById('prop-menu'); m.style.display = m.style.display === 'none' ? 'block' : 'none'; }

        async function loadData() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'flex';
            const h = { 'Authorization': 'bearer ' + localStorage.getItem('db_password') };
            try {
                const [pRes, cRes] = await Promise.all([fetch(WORKER_URL+'/api/props', {headers:h}), fetch(WORKER_URL+'/api/colors', {headers:h})]);
                if(!pRes.ok || !cRes.ok) throw new Error("Auth failed");
                freqProps = await pRes.json(); renderFreq();
                renderColors(await cRes.json());
            } catch(e) { logout(); }
        }

        async function createNewProp() {
            const n = document.getElementById('newPropName').value.trim();
            const t = document.getElementById('newPropType').value;
            if(!n) return;
            addProp(n, t);
            if(!freqProps.find(p => p.name.toLowerCase() === n.toLowerCase())) {
                freqProps.push({name:n, type:t}); renderFreq();
                await fetch(WORKER_URL+'/api/props', {method:'POST', headers:{'Content-Type':'application/json','Authorization':'bearer '+localStorage.getItem('db_password')}, body:JSON.stringify({name:n, type:t})});
            }
            document.getElementById('newPropName').value = '';
        }

        function renderFreq() {
            const l = document.getElementById('freq-list'); l.innerHTML = '';
            freqProps.forEach(p => {
                l.innerHTML += `<div class="freq-chip"><span class="freq-chip-add" onclick="addProp('${p.name}','${p.type}')">+ ${p.name}</span><span class="freq-chip-del" onclick="delFreq('${p.name}')">✕</span></div>`;
            });
        }

        async function delFreq(n) {
            freqProps = freqProps.filter(p => p.name !== n); renderFreq();
            await fetch(WORKER_URL+'/api/props', {method:'DELETE', headers:{'Content-Type':'application/json','Authorization':'bearer '+localStorage.getItem('db_password')}, body:JSON.stringify({name:n})});
        }

        function addProp(name, type) {
            if(currentProps.find(p => p.name === name)) return;
            currentProps.push({name, type, value: type==='check'?false:(type==='slider'?5:'')});
            toggleMenu(); renderActive();
        }

        function renderActive() {
            const c = document.getElementById('active-props'); c.innerHTML = '';
            currentProps.forEach((p, i) => {
                let input = `<input type="text" class="prop-input-text" oninput="currentProps[${i}].value=this.value" value="${p.value}">`;
                if(p.type === 'check') input = `<input type="checkbox" onchange="currentProps[${i}].value=this.checked" ${p.value?'checked':''}>`;
                if(p.type === 'slider') input = `<input type="range" min="1" max="10" class="prop-input-slider" oninput="currentProps[${i}].value=this.value" value="${p.value}">`;
                c.innerHTML += `<div class="prop-row"><label>${p.name}</label>${input}<span onclick="currentProps.splice(${i},1);renderActive()" style="color:#ef4444;cursor:pointer;font-weight:bold;">✕</span></div>`;
            });
        }

        async function login() {
            const p = document.getElementById('password').value.toLowerCase();
            const res = await fetch(WORKER_URL + '/api/login', { method: 'POST', body: JSON.stringify({ password: p }) });
            if (res.ok) { localStorage.setItem('db_password', p); loadData(); } else { alert('Wrong password!'); }
        }

        async function saveColor() {
            const body = {
                name: document.getElementById('colorName').value || 'Unnamed Entry',
                hex1: activeColors[0], hex2: activeColors[1],
                length: document.getElementById('lengthInput').value, girth: document.getElementById('girthInput').value,
                unit: useInches ? 'in' : 'cm', customFields: currentProps
            };
            const res = await fetch(WORKER_URL + '/api/colors', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json', 'Authorization': 'bearer ' + localStorage.getItem('db_password') }, 
                body: JSON.stringify(body) 
            });
            if (res.ok) { showToast("Saved!"); setTimeout(() => location.reload(), 500); } else { const err = await res.json(); alert("Error: " + err.error); }
        }

        async function deleteColor(id) { if(confirm('Delete?')) { await fetch(WORKER_URL+'/api/colors',{method:'DELETE', headers:{'Content-Type':'application/json','Authorization':'bearer '+localStorage.getItem('db_password')}, body:JSON.stringify({id})}); loadData(); } }
        function logout() { localStorage.removeItem('db_password'); location.reload(); }
        function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2000); }

        function renderColors(colors) {
            const l = document.getElementById('colorList'); l.innerHTML = '';
            colors.forEach(c => {
                const h1 = c.hex1 || '#000', h2 = c.hex2 || '#fff', u = c.unit || 'cm';
                const tags = (c.customFields || []).map(f => `<span class="tag">${f.name}: ${f.value === true ? 'Yes' : (f.value === false ? 'No' : f.value)}</span>`).join('');
                l.innerHTML += `
                    <div class="color-item">
                        <div class="full-bar" style="background:linear-gradient(to right, ${h1} 50%, ${h2} 50%)" onclick="navigator.clipboard.writeText('Base: ${h1} | Tip: ${h2}');showToast('Hex Copied!')"></div>
                        <div class="item-content">
                            <div class="details">
                                <h3>${c.name}</h3>
                                <p>Base: <span style="color:${h1}">${h1}</span> &bull; Tip: <span style="color:${h2}">${h2}</span></p>
                                <p>L: ${c.length || 'Ø'} ${u} &bull; G: ${c.girth || 'Ø'} ${u}</p>
                                <div>${tags}</div>
                            </div>
                            <button class="delete-btn" onclick="deleteColor('${c.id}')">✕</button>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
